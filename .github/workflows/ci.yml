name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg for video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[web,dev]"
      - name: Cache C2PA conformance samples
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/c2pa-public-testfiles
          key: c2pa-samples-22beccc07570
      - name: Fetch pinned samples
        run: provlens datasets fetch
      - name: Tests
        run: pytest -q
      - name: Evaluation holds its published numbers
        run: pytest -q -m slow
