name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg for video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[web,dev]"
      - name: Cache C2PA conformance samples
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/c2pa-public-testfiles
          key: c2pa-samples-22beccc07570
      - name: Fetch pinned samples
        run: provlens datasets fetch
      - name: Tests
        run: pytest -q
      - name: Evaluation holds its published numbers
        run: pytest -q -m slow
