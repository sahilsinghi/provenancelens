name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg for video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[web,dev]"
      - name: Cache C2PA conformance samples
        uses: actions/cache@v4
        with:
          path: .cache/c2pa-public-testfiles
          key: c2pa-samples-22beccc07570
      - name: Fetch pinned samples
        run: provlens datasets fetch
      - name: Tests
        run: pytest -q
      - name: Evaluation holds its published numbers
        run: pytest -q -m slow
